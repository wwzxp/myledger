name: 打包

# 三平台各打一次单文件二进制，产物挂到 Release。
# PyInstaller 不能交叉编译：Linux 的包只能在 Linux 上打，macOS 的只能在 macOS 上打。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 必须用最老的 Ubuntu 构建：二进制会依赖构建机的 glibc 版本。
          # ubuntu-latest 已是 24.04（glibc 2.39），打出来的包在 22.04（2.35）
          # 上会报 `GLIBC_2.38 not found`。22.04 runner 打出来的包向上兼容。
          - os: ubuntu-22.04
            label: linux-x86_64
            artifact: myledger-linux-x86_64
          # macos-latest 会随 GitHub 滚动；固定到 14 以稳定产出 arm64
          - os: macos-latest
            label: macos-arm64
            artifact: myledger-macos-arm64
          - os: windows-latest
            label: windows-x86_64
            artifact: myledger-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.10 起步即可：代码只用到 tomllib，3.10 由 tomli 回退
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: 打包
        run: python scripts/build-binary.py

      - name: 冒烟测试（版本与帮助）
        shell: bash
        run: |
          BIN=dist/myledger
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "./$BIN" --version
          "./$BIN" --help > /dev/null

      - name: 在 Ubuntu 22.04 容器里实跑（Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # 唯一可靠的兼容性验证：真的在目标 glibc 上跑一次。
          # PyInstaller 把 libpython 等 .so 内嵌进可执行文件，
          # objdump 只看主程序会漏判（曾误报 2.14，实际要 2.38）。
          docker run --rm -v "$PWD/dist:/dist:ro" ubuntu:22.04 \
            bash -lc '/dist/myledger --version && /dist/myledger --help | head -3'

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/myledger*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出产物
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
