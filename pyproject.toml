[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myledger"
version = "0.1.0"
description = "把微信/支付宝账单变成可信的月度结论。本地优先，规则优先分类。"
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "pyzipper>=0.3",
    "cryptography>=42",
    "pdfplumber>=0.11",
    # Python 3.10 没有 tomllib，用官方回移包；3.11+ 不装
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
myledger = "app.__main__:main_cli"

[tool.setuptools]
packages = ["app", "app.bookkeeping_app"]

[tool.setuptools.package-data]
app = ["config.yaml"]
"app.bookkeeping_app" = ["static/**/*", "static/*"]
